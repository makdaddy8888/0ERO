name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security check even if no commits
    - cron: "0 6 * * 1"

jobs:
  test-audit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Privacy audit (no AI SDKs, no external fetch)
        run: npm run privacy:audit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
